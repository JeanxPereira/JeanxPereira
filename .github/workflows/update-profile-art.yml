name: Update contribution heatmap

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/common.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both scripts are stdlib-only, so there is nothing to install.
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmaps
        run: |
          for theme in violet toxic wine; do
            THEME=$theme python scripts/render_heatmap_svg.py
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json assets/heatmap*.svg"
